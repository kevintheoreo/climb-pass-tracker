[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send every path to index.html so deep links work (status 200, not a redirect).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must always be re-fetched so users get updates promptly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The web manifest must be served as a manifest.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Security headers for every page. The app is local-only (D37): the policy lets the page load only its
# own scripts, styles and images, and talk to nothing but its own site, which backs up what the privacy
# policy says (nothing leaves the phone). e2e/csp.spec.ts runs the app's features under exactly this
# Content-Security-Policy, so a change that needs more (an inline style, a font, a web address) fails
# there first.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
